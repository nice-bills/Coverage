# The standing meter. Hourly during judging (6-hourly otherwise): fetch the epochs that closed, score the frozen
# rounds and commit to main. Freezing a new 5-epoch round (about daily) is paused until judging ends.
# A push only rebuilds and deploys; it never commits.
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly through judging (16 to 18 Nov 2026) and until 25 Nov, so a closed round is scored within the hour; was every 6 hours
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Self-test, output saved for the dashboard's "Check it yourself" panel
        run: python3 record.py out/selftest.json python3 test_run.py   # exits with test_run.py's code
      - name: Fetch epochs newer than the cache
        id: fetch
        run: python3 fetch.py --epochs 45
        timeout-minutes: 30
        continue-on-error: true   # rate limited or offline: publish from the committed cache
      - name: Refresh the buyback account's receipts for the reconciliation
        if: steps.fetch.outcome == 'success' && github.event_name != 'push'
        continue-on-error: true   # run.py only reconciles epochs the committed history covers
        timeout-minutes: 15
        run: python3 fetch.py history
      # Paused until 25 Nov 2026 (judging is 16 to 18 Nov): a new round moves the headline snapshot away from the submitted
      # figures, and the three open rounds are what judging scores. Re-enable by restoring the condition below.
      - name: Keep the committed cache if a fetch stopped part-way
        # fetch.py writes the CSVs before it re-hashes them into data/sources.json; a run cut off in between would fail
        # the self-test below and block the deploy, so fall back to the committed data instead
        run: python3 test_run.py > /dev/null 2>&1 || { echo "cache inconsistent after fetch; restoring the committed data"; git checkout -- data; }
      - name: Freeze a new round when three epochs have closed since the newest one
        if: false && steps.fetch.outcome == 'success' && github.event_name != 'push'
        continue-on-error: true
        run: |
          before=$(ls predictions/*.json | sort)
          python3 run.py freeze-if-due 5
          for f in $(comm -13 <(echo "$before") <(ls predictions/*.json | sort)); do
            pip install --quiet opentimestamps-client && ots stamp "$f" || echo "timestamp failed for $f; the commit time still dates it"
          done
      - name: Upgrade pending timestamps to Bitcoin attestations
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          pip install --quiet opentimestamps-client
          for f in predictions/*.ots; do ots upgrade "$f" || true; done
          rm -f predictions/*.bak
      - run: python3 run.py
      - run: python3 docs.py
      - run: python3 test_run.py
      - name: Commit the new epochs, scores and rounds
        if: steps.fetch.outcome == 'success' && github.event_name != 'push'
        run: |
          git config user.name "coverage-meter"
          git config user.email "coverage-meter@users.noreply.github.com"
          git add data predictions out dist README.md THESIS.md SUBMISSION.md
          git diff --cached --quiet && exit 0
          git commit -m "Meter: epochs to $(tail -1 data/epochs.csv | cut -d, -f2), rounds scored"
          git pull --rebase -X theirs && git push || echo "push skipped: main moved; the next run retries"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
