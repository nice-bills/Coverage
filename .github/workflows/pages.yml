# Rebuilds the dashboard and scores the frozen predictions against new epochs. main is never modified.
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_run.py
      - name: Fetch epochs newer than the cache
        run: python3 fetch.py --epochs 45
        timeout-minutes: 30
        continue-on-error: true   # rate limited or offline: publish from the committed cache
      - run: python3 run.py
      - run: python3 docs.py --check || true   # docs are regenerated only on main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
