<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Coverage demo film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=block">
<style>
:root{--paper:#F5F0E6;--card:#FAF6EE;--ink:#1D1B17;--ink2:#4A453C;--muted:#7A7265;--rule:#DDD4C3;--teal:#008C80;--terra:#C4532D;--gray:#E3DBCB;
--serif:"Instrument Serif",Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
#stage{position:absolute;inset:0}
.a{position:absolute;will-change:transform,opacity}
.eyebrow{font:500 22px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--serif);letter-spacing:-.02em}
.cap{left:120px;bottom:70px;max-width:1480px;font:500 46px/1.25 var(--sans);color:var(--ink)}
.cap b{font-weight:600}.cap .t{color:var(--teal)}.cap .r{color:var(--terra)}
.frame{border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--rule);box-shadow:0 40px 90px -40px rgba(29,27,23,.45)}
.frame .bar{height:44px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:0 18px;background:#EFE8DA}
.frame .bar i{width:13px;height:13px;border-radius:50%;background:#D9CFBD}
.frame .bar span{margin-left:16px;font:400 18px var(--mono);color:var(--muted)}
.frame .view{position:relative;overflow:hidden}
.frame img{position:absolute;left:0;top:0;transform-origin:0 0}
.term{background:var(--ink);color:#F5F0E6;border-radius:22px;padding:40px 48px;font:400 30px/1.55 var(--mono);box-shadow:0 40px 90px -40px rgba(29,27,23,.5)}
.term .ok{color:#7FD1C4}.term .dim{color:#9C9384}
.track{height:64px;border-radius:12px;background:var(--gray);overflow:hidden;position:relative}
.seg{position:absolute;top:0;bottom:0;left:0}
.tick{position:absolute;top:0;width:6px;height:100%;background:var(--paper)}
.rule{height:2px;background:var(--ink)}
</style></head><body><div id="stage"></div>
<script src="data.js"></script>
<script>
// ---- render contract: window.seek(t) paints second t; nothing else drives the picture ----
const W=1920,H=1080,DUR=72,S=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
// closed-form damped spring, 0 at t<=0, settles to 1
function spring(t,f=2.2,z=0.62){if(t<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t))}
const snap=t=>spring(t,3.2,0.8), settle=t=>spring(t,1.6,0.75), land=t=>spring(t,2.4,0.55);
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const fmt=n=>Math.round(n).toLocaleString('en-US');
// element pool: one DOM node per id, styled every frame
const pool={};
function el(id,html,cls='a'){let e=pool[id];if(!e){e=document.createElement('div');e.className=cls;S.appendChild(e);pool[id]=e;e._h=null}
 if(html!==e._h){e.innerHTML=html;e._h=html}e.style.display='block';return e}
function put(e,{x=0,y=0,o=1,s=1,r=0}){e.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;e.style.opacity=o}
// enter: slides up a little with a spring, holds, leaves by sliding up and fading; nothing just fades in
function show(id,html,cls,t,a,b,x,y,{dy=40,kind=land,out=.35}={}){
 if(t<a-0.01||t>b+out){if(pool[id])pool[id].style.display='none';return null}
 const e=el(id,html,cls),k=kind(t-a),q=ease(lin(t,b,b+out));put(e,{x,y:y+dy*(1-k)-30*q,o:clamp(k*1.6)*(1-q)});return e}
const D=window.D;
const scenes=[0,5,10,18,24,32,39,46,53,61,67,72];

function caption(id,html,t,a,b){return show(id,html,'a cap',t,a,b,0,0,{dy:24,kind:snap,out:.3})}

// screens are shown whole: the view takes the image's own aspect ratio, at most 690 px tall and 1240 px wide,
// so the right-hand side stays free for the badge; a slow 2.5% push-in from the centre is the only crop
const ASPECT={hero:2880/1800,epochs:2102/1408,bq:1972/960,path:2102/1244,rounds:2102/1412};
let FRAME_R=1420;
function shotFrame(id,img,url,t,a,b){
 const ar=ASPECT[img.replace('.png','')],h=Math.round(Math.min(690,1240/ar)),w=Math.round(h*ar),x=120,y=118;
 FRAME_R=x+w;
 const e=show(id,`<div class="frame" style="width:${w}px"><div class="bar"><i></i><i></i><i></i><span>${url}</span></div><div class="view" style="height:${h}px"><img src="../assets/${img}" style="width:${w}px;height:${h}px;transform-origin:50% 50%"></div></div>`,'a',t,a,b,x,y,{dy:60,kind:settle,out:.4});
 if(!e)return;const k=ease(lin(t,a,b));e.querySelector('img').style.transform=`scale(${1+0.025*k})`;}

function badge(id,big,small,t,a,b,color){
 return show(id,`<div style="background:var(--card);border:2px solid ${color};border-radius:24px;padding:22px 30px;box-shadow:0 30px 60px -30px rgba(29,27,23,.5)"><div class="serif" style="font-size:96px;line-height:1;color:${color}">${big}</div><div style="font:500 24px/1.3 var(--sans);color:var(--ink2);margin-top:6px;max-width:330px">${small}</div></div>`,'a',t,a,b,FRAME_R+48,170,{dy:50,kind:land,out:.3});}
window.seek=function(t){
 for(const k in pool)pool[k].style.display='none';
 // persistent brand mark, top left, from 0.6 s
 show('brand','<span class="serif" style="font-size:40px">Coverage</span><span class="eyebrow" style="margin-left:22px">NEAR, measured from the chain</span>','a',t,0.6,DUR,120,64,{dy:0,kind:snap});
 // progress rule across the bottom: where in the film we are
 const pr=el('prog','<div style="height:6px;background:var(--teal);border-radius:3px"></div>');put(pr,{x:0,y:H-6});pr.firstChild.style.width=(W*t/DUR)+'px';

 // 1 HOOK 0-5
 show('h1a','<div class="eyebrow">What a fee-burn dashboard tells you</div>','a',t,0.3,4.6,120,250);
 show('h1b','<div class="serif" style="font-size:92px;line-height:1.05;max-width:1500px">NEAR burns back only</div>','a',t,0.7,4.6,120,320);
 const hb=show('h1c',`<div class="serif" style="font-size:300px;line-height:1;color:var(--terra)">${D.burn_cov}</div>`,'a',t,1.6,4.6,112,430,{dy:90});
 show('h1d','<div style="font:500 44px var(--sans);color:var(--ink2)">of the new NEAR it mints.</div>','a',t,2.4,4.6,130,770);

 // 2 PROBLEM 5-10
 show('p1','<div class="serif" style="font-size:96px;line-height:1.05">That number is right.</div>','a',t,5.1,9.6,120,250);
 show('p2','<div class="serif" style="font-size:96px;line-height:1.05;color:var(--terra)"><i>It measures the wrong layer.</i></div>','a',t,6.1,9.6,120,360);
 // the bar: minted, with burn sliver; carries on into the reveal
 const barOn=t>=6.8&&t<=17.6;
 if(barOn){const kIn=settle(t-6.8),kOut=ease(lin(t,17.2,17.6));
  const e=el('bar',`<div style="width:1680px"><div style="display:flex;justify-content:space-between;font:500 30px var(--sans);margin-bottom:16px"><span>Every NEAR minted, ${fmt(D.mint)} a day</span><span id="bl" style="color:var(--teal)"></span></div><div class="track"><div class="seg" id="sb" style="background:var(--teal)"></div><div class="seg" id="sr" style="background:var(--terra)"></div></div></div>`);
  put(e,{x:120,y:640+30*(1-kIn)-20*kOut,o:clamp(kIn*1.5)*(1-kOut)});
  const g=clamp(spring(t-11.2,0.9,0.85)); // the buyback segment grows
  const bw=1680*D.buy_v*g, rw=Math.max(1680*D.burn_v,8);
  e.querySelector('#sb').style.width=bw+'px';const sr=e.querySelector('#sr');sr.style.left=bw+'px';sr.style.width=rw+'px';
  e.querySelector('#bl').textContent=t<11.2?`burnt: ${D.burn_cov}`:`won back: ${(100*(D.burn_v+D.buy_v*g)).toFixed(1)}%`;
  e.querySelector('#bl').style.color=t<11.2?'var(--terra)':'var(--teal)';}

 // 3 REVEAL 10-18
 show('r1','<div class="eyebrow">Count the second flow</div>','a',t,10.1,17.4,120,250);
 show('r2',`<div class="serif" style="font-size:88px;line-height:1.08;max-width:1600px">NEAR Intents sends <span style="color:var(--teal)">${fmt(D.buy)} NEAR a day</span> to a buyback account.</div>`,'a',t,10.4,17.4,120,320);
 show('r3',`<div style="display:flex;gap:80px;align-items:baseline"><div><div class="eyebrow" style="margin-bottom:12px">Won back</div><div class="serif" style="font-size:150px;line-height:1;color:var(--teal)">${D.payback}</div></div><div><div class="eyebrow" style="margin-bottom:12px">Break-even</div><div class="serif" style="font-size:150px;line-height:1">${D.mult} <span style="color:var(--muted);text-decoration:line-through;text-decoration-color:var(--terra);text-decoration-thickness:6px">${D.burn_mult}</span></div></div></div>`,'a',t,13.6,17.4,120,770,{dy:60});

 // 4 PRODUCT 18-24
 shotFrame('f_hero','hero.png','nice-bills.github.io/Coverage',t,17.55,23.6);
 badge('b4',D.payback,'of issuance won back, from the chain',t,20.3,23.5,'var(--teal)');
 caption('c4','A live research report. <b>Every number comes from NEAR mainnet.</b>',t,18.6,23.6);

 // 5 PROOF 1: terminal 24-32
 if(t>=24&&t<=32.4){const typed='python3 run.py',nT=Math.floor(clamp((t-24.15)/1.0)*typed.length);
  const lines=D.ledger.slice(0,Math.floor(clamp((t-25.3)/1.6)*D.ledger.length));
  const res=t>=27.1?`<div class="ok">${D.result}</div>`:'';
  const cmp=t>=28.4?`<div style="margin-top:22px;padding-top:18px;border-top:1px solid #4A453C"><span class="dim">README.md says</span> sha256=${D.readme_hash} <span class="ok">✓ match</span></div>`:'';
  show('term',`<div class="term" style="width:1680px;height:600px"><div><span class="dim">$</span> ${typed.slice(0,nT)}<span style="opacity:${(Math.floor(t*2)%2)?1:0}">▍</span></div><div class="dim" style="font-size:25px;margin-top:12px">${lines.join('<br>')}</div>${res}${cmp}</div>`,'a',t,24,31.6,120,150,{dy:50,kind:settle,out:.4});}
 caption('c5','One command. No keys, no network. <b>Every number rebuilt in 2 seconds, with a hash.</b>',t,24.8,31.6);

 // 6 PROOF 2: epochs 32-39
 shotFrame('f_ep','epochs.png','every epoch since 13 Feb',t,32,38.6);
 badge('b6',D.epochs,'epochs, each checked to start where the last one ended',t,34.8,38.5,'var(--ink)');
 caption('c6','Every epoch since February, <b>read from block headers to the yoctoNEAR.</b>',t,32.6,38.6);

 // 7 PROOF 3: BigQuery 39-46
 shotFrame('f_bq','bq.png','Network activity · BigQuery',t,39,45.6);
 badge('b7',D.intents_x,'more Intents activity, while the chain fell',t,41.8,45.5,'var(--teal)');
 caption('c7',`The chain got quieter: accounts <span class="r">${D.dau}</span>. Intents didn't: <span class="t"><b>${D.intents_x} more activity.</b></span>`,t,39.6,45.6);

 // 8 FUTURE 46-53
 shotFrame('f_path','path.png','The path to break-even',t,46,52.6);
 badge('b8','16 Nov','HSP-029 veto window closes, during judging',t,48.8,52.5,'var(--terra)');
 caption('c8','Break-even turns on <b>two votes</b>: fee capture, and HSP-029 <span style="color:var(--muted)">(veto window closes 16 Nov)</span>.',t,46.6,52.6);

 // 9 LIVE 53-61
 shotFrame('f_rounds','rounds.png','Check it yourself · live forecasts',t,53,60.6);
 badge('b9',D.so_far,`payback so far, inside ${D.inside} ranges`,t,55.8,60.5,'var(--teal)');
 caption('c9',`Frozen in Bitcoin before the data existed. <span class="t"><b>${D.so_far} so far, inside ${D.inside} ranges.</b></span> They close 14–18 Nov, while you judge.`,t,53.6,60.6);

 // 10 VERDICT 61-67
 show('v0','<div class="eyebrow">Verdict for an investor</div>','a',t,60.9,66.6,120,240);
 show('v1','<div class="serif" style="font-size:118px;line-height:1.02">Not yet a supply story.</div>','a',t,61.1,66.6,120,300);
 show('v2','<div class="serif" style="font-size:118px;line-height:1.02;color:var(--teal)"><i>The bet is governance.</i></div>','a',t,62.6,66.6,120,430);
 show('v3',`<div style="font:500 40px/1.4 var(--sans);color:var(--ink2);max-width:1500px">Send every Intents fee to the buyback and cut issuance, and break-even comes in about <b style="color:var(--ink)">${D.full_cap_years} years</b>, not decades.</div>`,'a',t,63.8,66.6,120,640);

 // 11 CLOSE 67-72
 show('e1','<div class="serif" style="font-size:200px;line-height:1">Coverage</div>','a',t,67.1,72.5,120,260,{dy:70});
 show('e2','<div style="font:500 52px var(--sans)">nice-bills.github.io/Coverage</div>','a',t,67.8,72.5,124,520);
 show('e3','<div class="term" style="display:inline-block;padding:22px 34px;font-size:34px"><span class="dim">$</span> python3 run.py</div>','a',t,68.5,72.5,124,640);
 show('e4','<div style="font:500 34px var(--sans);color:var(--ink2)">github.com/nice-bills/Coverage · No keys. Check every number.</div>','a',t,69.2,72.5,124,800);
};
window.ready=Promise.all([document.fonts.ready,...[...new Set(['hero','epochs','bq','path','rounds'])].map(n=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src='../assets/'+n+'.png'}))]);
seek(0);
</script></body></html>
